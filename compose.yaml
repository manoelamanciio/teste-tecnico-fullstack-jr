services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polls}
      POSTGRES_USER: ${POSTGRES_USER:-polls}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polls}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  websocket:
    build:
      context: .
      dockerfile: docker/websocket/Dockerfile
    ports:
      - "8080:8080"

volumes:
  postgres_data: